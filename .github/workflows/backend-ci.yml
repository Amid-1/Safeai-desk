name: Проверка бэкенда

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 21, Maven, архитектура и интеграционные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Установка Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Проверка Java, Maven Wrapper и Docker
        run: |
          java -version
          ./mvnw --version
          docker info --format '{{.ServerVersion}}'

      - name: Полная сборка и стандартные тесты Maven
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Критичные интеграционные тесты PostgreSQL и Redis
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dtest=AuthPostgresConcurrencyIT,OrganizationSecurityGateConcurrencyIT,RedisFixedWindowRateLimiterIT
          test
