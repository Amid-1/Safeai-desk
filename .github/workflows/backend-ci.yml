#SafeAI-Desk/github/workflows/backend-ci.yml
name: Проверка бэкенда

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 21, Maven, архитектура и интеграционные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Установка Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Проверка Java, Maven Wrapper и Docker
        run: |
          java -version
          ./mvnw --version
          docker info --format '{{.ServerVersion}}'

      - name: Полная сборка и стандартные тесты Maven
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Контроль количества тестов и разрешённых пропусков Surefire
        working-directory: .
        run: python3 .github/scripts/check-maven-reports.py standard

      - name: Контроль всех локальных IT и инвентаризация модулей
        working-directory: .
        run: python3 .github/scripts/check-backend-test-discovery.py

      - name: Проверка неизменности истории Flyway
        working-directory: .
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 .github/scripts/check-flyway-migrations.py --base origin/main

      - name: Проверка baseline покрытия каждого backend-модуля
        working-directory: .
        run: python3 .github/scripts/check-backend-coverage.py --check

      - name: Критичные интеграционные тесты PostgreSQL и Redis
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dtest=AuthPostgresConcurrencyIT,OrganizationSecurityGateConcurrencyIT,RedisFixedWindowRateLimiterIT
          test

  performance:
    name: Usage PostgreSQL / performance SLA
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Установка Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Проверка Docker для Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Выполнение всех JUnit-тестов с тегом performance
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dgroups=performance
          -Dsafeai.usage.performance=true
          test

      - name: Требование успешных performance-тестов без пропусков
        working-directory: .
        run: python3 .github/scripts/check-maven-reports.py performance

      - name: Сохранение SQL EXPLAIN и отчётов при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usage-performance-failure-${{ github.sha }}
          path: |
            backend/target/usage-explain/
            backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
