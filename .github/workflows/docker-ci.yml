name: Docker и Compose

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/verify-build.mjs'
      - '.github/workflows/docker-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'scripts/verify-build.mjs'
      - '.github/workflows/docker-ci.yml'

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Dockerfiles, Compose и image scan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Проверка Docker и Compose
        run: |
          docker version
          docker compose version

      - name: Проверка production Compose topology
        shell: bash
        run: |
          set -Eeuo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/config" "$temp_dir/secrets"
          cp infra/config/pricing.yml.example "$temp_dir/config/pricing.yml"

          python3 - "$temp_dir" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          env_path = root / "backend.env"
          text = Path("backend/.env.prod.example").read_text(encoding="utf-8")
          values = {
              "SAFEAI_BACKEND_IMAGE": "ghcr.io/example/safeai-backend:ci",
              "SAFEAI_NGINX_IMAGE": "ghcr.io/example/safeai-nginx:ci",
              "SAFEAI_PROMETHEUS_IMAGE": "prom/prometheus:v3.5.0",
              "POSTGRES_IMAGE": "pgvector/pgvector:pg16",
              "REDIS_IMAGE": "redis:8-alpine",
              "SAFEAI_CONFIG_DIR": str(root / "config"),
              "SAFEAI_SECRETS_DIR": str(root / "secrets"),
              "SAFEAI_JWT_ISSUER": "https://safeai.example.test",
              "SAFEAI_CORS_ALLOWED_ORIGINS": "https://safeai.example.test",
              "SAFEAI_KNOWLEDGE_STORAGE_ENDPOINT": "https://s3.example.test",
              "SAFEAI_RUNTIME_ENV_FILE": str(env_path),
          }
          lines = text.splitlines()
          for key, value in values.items():
              matches = [i for i, line in enumerate(lines) if line.startswith(key + "=")]
              if key == "SAFEAI_RUNTIME_ENV_FILE" and not matches:
                  lines.append(f"{key}={value}")
                  continue
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {key} in production env example")
              lines[matches[0]] = f"{key}={value}"
          env_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          secret_names = [
              "postgres_bootstrap_password", "db_migrator_password", "db_app_password",
              "redis_password", "rate_limit_hmac_secret", "openai_api_key",
              "knowledge_ocr_api_key", "anthropic_api_key",
              "knowledge_storage_access_key", "knowledge_storage_secret_key", "jwt-keys.yml",
          ]
          for name in secret_names:
              (root / "secrets" / name).write_text("ci-only-placeholder\n", encoding="utf-8")
          PY

          docker compose --env-file "$temp_dir/backend.env" \
            -f infra/docker-compose.yml config --quiet

      - name: Сборка backend image
        run: docker build --pull --file backend/Dockerfile --tag safeai-backend:ci backend

      - name: Сборка frontend/Nginx image
        run: docker build --pull --file infra/nginx/Dockerfile --tag safeai-nginx:ci .

      - name: Сборка hardened PostgreSQL image
        run: |
          docker build --pull \
            --file infra/postgres/Dockerfile \
            --build-arg SAFEAI_READER_GID=21001 \
            --tag safeai-postgres:ci .

      - name: Сканирование backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: safeai-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Сканирование frontend/Nginx image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: safeai-nginx:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Сканирование PostgreSQL image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: safeai-postgres:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
