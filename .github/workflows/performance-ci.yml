# SafeAI-Desk/.github/workflows/performance-ci.yml
name: Performance CI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  performance:
    name: PostgreSQL performance and erasure boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Установка Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Проверка Docker для Testcontainers
        run: docker version

      - name: Нагрузочные и граничные тесты PostgreSQL
        working-directory: backend
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -Dsafeai.erasure.load-tests=true \
            -Dsafeai.usage.performance=true \
            -Dtest=ChatErasureBatchBoundaryV86IntegrationTest,UsageExplainAnalyzePerformanceIntegrationTest,UsagePerformanceIntegrationTest,UsagePhysicalExplainPerformanceIntegrationTest \
            clean test

      - name: Проверка полноты результатов Performance CI
        run: python3 .github/scripts/check-performance-reports.py backend/target/surefire-reports

      - name: Проверка правил оповещения Usage
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/prometheus:/config:ro" \
            -w /config prom/prometheus:v3.5.0 check rules rules/safeai-usage.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/prometheus:/config:ro" \
            -w /config prom/prometheus:v3.5.0 test rules tests/usage.test.yml

      - name: Проверка правил оповещения Models и AI
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/promtool -v "$PWD/infra/prometheus:/config:ro" \
            -w /config prom/prometheus:v3.5.0 check rules rules/safeai-model-ai.yml
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/promtool -v "$PWD/infra/prometheus:/config:ro" \
            -w /config prom/prometheus:v3.5.0 test rules tests/model-ai.test.yml

      - name: Проверка правил оповещения RateLimit
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/promtool -v "$PWD/infra/prometheus:/config:ro" \
            -w /config prom/prometheus:v3.5.0 check rules rules/safeai-ratelimit.yml
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/promtool -v "$PWD/infra/prometheus:/config:ro" \
            -w /config prom/prometheus:v3.5.0 test rules tests/ratelimit.test.yml

      - name: Отчёты Surefire и планы EXPLAIN ANALYZE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/usage-explain/*.txt
          if-no-files-found: warn
          retention-days: 14

  ratelimit:
    name: Redis RateLimit / security and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Установка Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Локальная Security-приёмка Redis
        run: bash infra/scripts/verify-ratelimit-acceptance.sh

      - name: Изолированная проверка HTTP edge и границы trusted proxy
        run: bash infra/scripts/test-ratelimit-nginx.sh

      - name: Отчёты RateLimit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratelimit-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: backend/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
