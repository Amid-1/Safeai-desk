#SafeAI-Desk/github/workflows/frontend-ci.yml
name: Проверка фронтенда

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Архитектура, ESLint, тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Установка Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Проверка версий Node.js и npm
        run: |
          node --version
          npm --version

      - name: Установка зависимостей
        run: npm ci

      - name: Аудит production-зависимостей
        run: npm run audit:prod

      - name: Полный аудит зависимостей, включая dev
        run: npm audit --audit-level=low

      - name: Проверка архитектуры, ESLint, тестов и сборки
        run: npm run ci

      - name: Диаграммы Vitest по группам TypeScript/React
        working-directory: .
        run: python3 .github/scripts/quality-report.py --frontend

      - name: Сохранение HTML отчёта по покрытию frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeai-frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 30
