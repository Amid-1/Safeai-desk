## Safeai-desk/deploy/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: safeai-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          # Actuator is exposed on the dedicated management port in production.
          - backend:9091
