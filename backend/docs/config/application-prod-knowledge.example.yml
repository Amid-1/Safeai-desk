# # SafeAI-Desk/backend/docs/config/application-prod-knowledge.example.yml
# Windows path: D:\Java projects\Safeai-desk\backend\docs\config\application-prod-knowledge.example.yml
# Documentation-only example; not automatically loaded by Spring Boot.
# Production settings are primarily managed by application.yml/application-prod.yml
# and external /run/config/pricing.yml and /run/secrets/.
# Do not import this file wholesale: it is a focused example with an OCR policy.
safeai:
  knowledge:
    storage:
      type: s3
      endpoint: ${SAFEAI_KNOWLEDGE_STORAGE_ENDPOINT}
      access-key: ${SAFEAI_KNOWLEDGE_STORAGE_ACCESS_KEY}
      secret-key: ${SAFEAI_KNOWLEDGE_STORAGE_SECRET_KEY}
      bucket: ${SAFEAI_KNOWLEDGE_STORAGE_BUCKET:safeai-knowledge}
      max-upload-bytes: ${SAFEAI_KNOWLEDGE_MAX_UPLOAD_BYTES:26214400}

    embedding:
      provider: openai
      base-url: "https://api.openai.com/v1"
      api-key: ${OPENAI_EMBEDDING_API_KEY}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: 384
      batch-size: 64
      max-input-chars: 20000
      connect-timeout: 5s
      read-timeout: 30s

    ingestion:
      enabled: true
      poll-delay: 2s
      batch-size: 4
      processing-lease: 5m
      extraction-timeout: 2m
      extraction-threads: 2
      max-attempts: 5
      initial-backoff: 10s
      max-backoff: 10m
      max-extracted-chars: 2000000
      max-docx-uncompressed-bytes: 104857600
      chunk-size-chars: 1200
      chunk-overlap-chars: 150

    retrieval:
      max-query-chars: 4000
      max-top-k: 20
      candidate-limit: 100
      rrf-k: 60

    rag:
      top-k: 8
      max-context-chars: 24000
      max-chunk-chars: 6000

    # Keep OCR disabled unless scanned documents are part of the accepted
    # production feature set; HTTP OCR needs an explicit allowlist and testing.
    ocr:
      provider: disabled
      allowed-hosts: []
      min-native-chars-per-page: 20
      connect-timeout: 5s
      read-timeout: 90s
      max-response-bytes: 16777216
