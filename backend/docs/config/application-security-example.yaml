# "D:\Java projects\Safeai-desk\backend\docs\config\application-security-example.yaml"
safeai:
  security:
    client-ip:
      # Доверять только подсети контролируемого reverse proxy.
      trusted-proxy-cidrs:
        - 172.28.0.0/24

  cors:
    # Эквивалент переменной окружения:
    # SAFEAI_CORS_ALLOWED_ORIGINS=https://desk.example.com,https://admin.example.com
    allowed-origins:
      - https://desk.example.com
      - https://admin.example.com

app:
  security:
    jwt:
      # Production: передавать только через secret storage или environment.
      # Генерация: openssl rand -base64 32
      secret: ${SAFEAI_JWT_SECRET}
      expiration-minutes: ${SAFEAI_JWT_EXPIRATION_MINUTES:15}
      issuer: ${SAFEAI_JWT_ISSUER:safeai-desk}
      audience: ${SAFEAI_JWT_AUDIENCE:safeai-desk-api}
