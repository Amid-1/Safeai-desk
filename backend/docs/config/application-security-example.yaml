# "D:\Java projects\Safeai-desk\backend\docs\config\application-security-example.yaml"
safeai:
  security:
    client-ip:
      # Trust only networks controlled by your reverse proxy tier.
      trusted-proxy-cidrs:
        - 172.28.0.0/24

  cors:
    allowed-origins:
      - https://desk.example.com
      - https://admin.example.com

app:
  security:
    jwt:
      expiration-minutes: ${SAFEAI_JWT_EXPIRATION_MINUTES:15}
      issuer: ${SAFEAI_JWT_ISSUER}
      audience: ${SAFEAI_JWT_AUDIENCE:safeai-desk-api}
      active-key-id: ${SAFEAI_JWT_ACTIVE_KEY_ID}
      keys:
        - id: ${SAFEAI_JWT_ACTIVE_KEY_ID}
          public-key: ${SAFEAI_JWT_PUBLIC_KEY}
          private-key: ${SAFEAI_JWT_PRIVATE_KEY}
