# "D:\Java projects\Safeai-desk\backend\src\main\resources\application-local.yml"
app:
  security:
    jwt:
      issuer: http://localhost:8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safeai}
    username: ${SPRING_DATASOURCE_USERNAME:safeai}
    password: ${SPRING_DATASOURCE_PASSWORD:safeai_password}

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/local-migration

safeai:
  ai:
    provider: ${SAFEAI_AI_PROVIDER:mock}

    retry:
      enabled: ${SAFEAI_AI_RETRY_ENABLED:false}
      max-attempts: ${SAFEAI_AI_RETRY_MAX_ATTEMPTS:1}
      total-timeout: ${SAFEAI_AI_RETRY_TOTAL_TIMEOUT:65s}

  auth:
    cookies:
      secure: false
      same-site: Lax
      access-token-max-age: 15m
      refresh-token-max-age: 30d
      refresh-token-absolute-max-age: 90d
      reuse-detection-retention: 7d
      domain: ""
      access-token-name: safeai-access
      refresh-token-name: safeai-refresh

  rate-limit:
    redis:
      key-prefix: safeai:local
      hmac-secret: ${SAFEAI_RATE_LIMIT_REDIS_HMAC_SECRET:safeai-local-rate-limit-hmac-secret-change-before-production-2026}
      key-version: v1

    login:
      audit-organization-id: ${SAFEAI_RATE_LIMIT_LOGIN_AUDIT_ORGANIZATION_ID:00000000-0000-0000-0000-000000000001}

  security:
    client-ip:
      trusted-proxy-cidrs:
        - 127.0.0.1/32
        - ::1/128

    user-status-cache:
      enabled: true
      ttl: 60s
      key-prefix: safeai:local:user-status

    hsts:
      enabled: false

  audit:
    retention:
      enabled: false
