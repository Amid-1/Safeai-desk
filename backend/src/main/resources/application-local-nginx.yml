# "D:\Java projects\Safeai-desk\backend\src\main\resources\application-local-nginx.yml"
spring:
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/local-migration

safeai:
  security:
    client-ip:
      trusted-proxy-cidrs:
        - 127.0.0.1/32
        - ::1/128
        - 172.16.0.0/12

    user-status-cache:
      enabled: true
      ttl: 60s
      key-prefix: safeai:local:user-status

  auth:
    cookies:
      secure: false
      same-site: Lax

  rate-limit:
    redis:
      key-prefix: safeai:local

  audit:
    retention:
      enabled: false

  ai:
    provider: mock

    retry:
      enabled: false

server:
  forward-headers-strategy: framework