# "D:\Java projects\Safeai-desk\backend\src\main\resources\application-local-nginx.yml"

# Профиль local-nginx автоматически включает профиль local
# через spring.profiles.group.local-nginx в application.yml.
#
# В этом файле находятся только отличия запуска через локальный Nginx.

server:
  forward-headers-strategy: framework

safeai:
  security:
    client-ip:
      trusted-proxy-cidrs:
        - 127.0.0.1/32
        - ::1/128
        - 172.16.0.0/12