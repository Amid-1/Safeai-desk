# SafeAI-Desk/backend/src/main/resources/application-local-nginx.yml

# Profile local-nginx automatically includes local via spring.profiles.group.local-nginx.
# Spring intentionally does not process forwarded headers globally.
# ClientIpResolver trusts them only for connections from configured proxies.
server:
  forward-headers-strategy: none

safeai:
  security:
    client-ip:
      trusted-proxy-cidrs:
        - 127.0.0.1/32
        - ::1/128
        - 172.30.0.0/24
