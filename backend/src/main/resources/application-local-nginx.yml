# D:\Java projects\Safeai-desk\backend\src\main\resources\application-local-nginx.yml
#
# Профиль local-nginx автоматически включает local
# через spring.profiles.group.local-nginx.
#
# Forwarded headers намеренно НЕ обрабатываются Spring.
# ClientIpResolver самостоятельно доверяет им только
# при соединении от trusted proxy.

server:
  forward-headers-strategy: none

safeai:
  security:
    client-ip:
      trusted-proxy-cidrs:
        - 127.0.0.1/32
        - ::1/128
        - 172.16.0.0/12