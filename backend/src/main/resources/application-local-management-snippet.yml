# D:\Java projects\Safeai-desk\backend\src\main\resources\application-local-management-snippet.yml
# Merge this under the existing top-level "management:" block
# in backend/src/main/resources/application-local.yml.
management:
  server:
    port: ${SAFEAI_MANAGEMENT_PORT:9091}
    address: ${SAFEAI_MANAGEMENT_ADDRESS:127.0.0.1}

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
            - redis
