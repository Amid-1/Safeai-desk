# "D:\Java projects\Safeai-desk\backend\src\main\resources\application-prod.yml"
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

safeai:
  rate-limit:
    redis:
      key-prefix: ${SAFEAI_RATE_LIMIT_REDIS_KEY_PREFIX:safeai:prod}

    login:
      enabled: ${SAFEAI_RATE_LIMIT_LOGIN_ENABLED:true}

    ai-messages:
      enabled: ${SAFEAI_RATE_LIMIT_AI_MESSAGES_ENABLED:true}