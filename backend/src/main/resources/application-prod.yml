# "D:\Java projects\Safeai-desk\backend\src\main\resources\application-prod.yml"
spring:
  flyway:
    locations:
      - classpath:db/migration

  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

safeai:
  auth:
    cookies:
      secure: true
      same-site: ${SAFEAI_AUTH_COOKIES_SAME_SITE:Lax}
      access-token-max-age: ${SAFEAI_AUTH_ACCESS_TOKEN_MAX_AGE:15m}
      refresh-token-max-age: ${SAFEAI_AUTH_REFRESH_TOKEN_MAX_AGE:30d}

  rate-limit:
    redis:
      key-prefix: ${SAFEAI_RATE_LIMIT_REDIS_KEY_PREFIX:safeai:prod}

    login:
      enabled: ${SAFEAI_RATE_LIMIT_LOGIN_ENABLED:true}

    ai-messages:
      enabled: ${SAFEAI_RATE_LIMIT_AI_MESSAGES_ENABLED:true}

  security:
    client-ip:
      trusted-proxy-cidrs: ${SAFEAI_SECURITY_CLIENT_IP_TRUSTED_PROXY_CIDRS:}

    user-status-cache:
      enabled: ${SAFEAI_USER_STATUS_CACHE_ENABLED:true}
      ttl: ${SAFEAI_USER_STATUS_CACHE_TTL:60s}
      key-prefix: ${SAFEAI_USER_STATUS_CACHE_KEY_PREFIX:safeai:prod:user-status}