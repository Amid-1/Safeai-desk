# "D:\Java projects\Safeai-desk\backend\src\main\resources\application.yml"
spring:
  application:
    name: safeai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safeai}
    username: ${SPRING_DATASOURCE_USERNAME:safeai}
    password: ${SPRING_DATASOURCE_PASSWORD:safeai_password}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 200

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  jackson:
    default-property-inclusion: non_null

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId}]"

server:
  port: 8080
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  security:
    jwt:
      secret: ${SAFEAI_JWT_SECRET}
      expiration-minutes: ${SAFEAI_JWT_EXPIRATION_MINUTES:15}
      issuer: ${SAFEAI_JWT_ISSUER:safeai-desk}
      audience: ${SAFEAI_JWT_AUDIENCE:safeai-desk-api}

safeai:

  chat:
    lock:
      key-prefix: ${SAFEAI_CHAT_LOCK_KEY_PREFIX:safeai:local:chat-lock}
      ttl: ${SAFEAI_CHAT_LOCK_TTL:240s}
    details-message-limit: ${SAFEAI_CHAT_DETAILS_MESSAGE_LIMIT:50}
    history-message-limit: ${SAFEAI_CHAT_HISTORY_MESSAGE_LIMIT:30}

  ai:
    provider: ${SAFEAI_AI_PROVIDER:mock}

    retry:
      enabled: ${SAFEAI_AI_RETRY_ENABLED:true}
      max-attempts: ${SAFEAI_AI_RETRY_MAX_ATTEMPTS:2}
      initial-backoff: ${SAFEAI_AI_RETRY_INITIAL_BACKOFF:250ms}
      max-backoff: ${SAFEAI_AI_RETRY_MAX_BACKOFF:2s}

    pricing:
      models:
        - model: mock-safeai
          input-usd-per-1m-tokens: 0
          output-usd-per-1m-tokens: 0
        - model: gpt-4.1
          input-usd-per-1m-tokens: 2.00
          output-usd-per-1m-tokens: 8.00
        - model: claude-opus-4-8
          input-usd-per-1m-tokens: 15.00
          output-usd-per-1m-tokens: 75.00

    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPENAI_READ_TIMEOUT:60s}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1024}
      max-response-chars: ${SAFEAI_AI_OPENAI_MAX_RESPONSE_CHARS:100000}
      store: ${OPENAI_STORE:false}

    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-4-8}
      version: ${ANTHROPIC_VERSION:2023-06-01}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
      max-response-chars: ${SAFEAI_AI_ANTHROPIC_MAX_RESPONSE_CHARS:100000}
      connect-timeout: ${ANTHROPIC_CONNECT_TIMEOUT:5s}
      read-timeout: ${ANTHROPIC_READ_TIMEOUT:60s}

  rate-limit:
    redis:
      key-prefix: ${SAFEAI_RATE_LIMIT_REDIS_KEY_PREFIX:safeai:local}


    login:
      enabled: ${SAFEAI_RATE_LIMIT_LOGIN_ENABLED:true}
      email-limit: ${SAFEAI_RATE_LIMIT_LOGIN_EMAIL_LIMIT:10}
      ip-limit: ${SAFEAI_RATE_LIMIT_LOGIN_IP_LIMIT:30}
      window: ${SAFEAI_RATE_LIMIT_LOGIN_WINDOW:10m}

    ai-messages:
      enabled: ${SAFEAI_RATE_LIMIT_AI_MESSAGES_ENABLED:true}
      user-limit-per-hour: ${SAFEAI_RATE_LIMIT_AI_MESSAGES_USER_LIMIT_PER_HOUR:20}
      admin-limit-per-hour: ${SAFEAI_RATE_LIMIT_AI_MESSAGES_ADMIN_LIMIT_PER_HOUR:100}
      organization-limit-per-hour: ${SAFEAI_RATE_LIMIT_AI_MESSAGES_ORGANIZATION_LIMIT_PER_HOUR:1000}

  cors:
    allowed-origins: http://localhost:5173

  auth:
    cookies:
      secure: ${SAFEAI_AUTH_COOKIES_SECURE:false}
      same-site: ${SAFEAI_AUTH_COOKIES_SAME_SITE:Lax}
      access-token-max-age: ${SAFEAI_AUTH_ACCESS_TOKEN_MAX_AGE:15m}
      refresh-token-max-age: ${SAFEAI_AUTH_REFRESH_TOKEN_MAX_AGE:30d}

  security:
    client-ip:
      trusted-proxy-cidrs: []
    user-status-cache:
      enabled: ${SAFEAI_USER_STATUS_CACHE_ENABLED:true}
      ttl: ${SAFEAI_USER_STATUS_CACHE_TTL:60s}
      key-prefix: ${SAFEAI_USER_STATUS_CACHE_KEY_PREFIX:safeai:local:user-status}

  platform:
    organization-id: 00000000-0000-0000-0000-000000000001

    # Demo pricing. Replace with real provider pricing before production billing.