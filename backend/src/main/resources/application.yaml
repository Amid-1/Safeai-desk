# "D:\Java projects\Safeai-desk\backend\src\main\resources\application.yml"
spring:
  application:
    name: safeai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safeai}
    username: ${SPRING_DATASOURCE_USERNAME:safeai}
    password: ${SPRING_DATASOURCE_PASSWORD:safeai_password}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 200

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId}]"

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${SAFEAI_JWT_SECRET}
      expiration-minutes: ${SAFEAI_JWT_EXPIRATION_MINUTES:60}
      issuer: ${SAFEAI_JWT_ISSUER:safeai-desk}

safeai:
  ai:
    provider: ${SAFEAI_AI_PROVIDER:mock}

    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1}
      connect-timeout: 5s
      read-timeout: 60s
      max-output-tokens: 1024

    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-4-8}
      version: ${ANTHROPIC_VERSION:2023-06-01}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
      connect-timeout: 5s
      read-timeout: 60s

  rate-limit:
    ai-messages:
      enabled: true
      user-limit-per-hour: 20
      admin-limit-per-hour: 100
    login:
      enabled: ${SAFEAI_RATE_LIMIT_LOGIN_ENABLED:true}
      email-limit: ${SAFEAI_RATE_LIMIT_LOGIN_EMAIL_LIMIT:10}
      ip-limit: ${SAFEAI_RATE_LIMIT_LOGIN_IP_LIMIT:30}
      window: ${SAFEAI_RATE_LIMIT_LOGIN_WINDOW:10m}

  cors:
    allowed-origins: ${SAFEAI_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  platform:
    organization-id: 00000000-0000-0000-0000-000000000001