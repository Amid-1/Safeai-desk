# "D:\Java projects\Safeai-desk\backend\src\main\resources\application.yml"
spring:
  application:
    name: safeai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safeai}
    username: ${SPRING_DATASOURCE_USERNAME:safeai}
    password: ${SPRING_DATASOURCE_PASSWORD:safeai_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${SAFEAI_JWT_SECRET}
      expiration-minutes: ${SAFEAI_JWT_EXPIRATION_MINUTES:60}