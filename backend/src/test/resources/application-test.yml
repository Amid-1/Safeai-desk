# D:\Java projects\Safeai-desk\backend\src\test\resources\application-test.yml
app:
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      expiration-minutes: 15
      issuer: https://issuer.safeai.test
      audience: safeai-desk-api

spring:
  data:
    redis:
      repositories:
        enabled: false

safeai:
  auth:
    cookies:
      secure: false
      same-site: Lax
      access-token-max-age: 15m
      refresh-token-max-age: 30d
      refresh-token-absolute-max-age: 90d
      reuse-detection-retention: 7d
      domain: ""
      access-token-name: safeai-access
      refresh-token-name: safeai-refresh

    refresh-cleanup:
      cron: "0 0 3 * * *"
      batch-size: 200
      max-batches-per-run: 100

  ai:
    provider: mock

    anthropic:
      api-key: test-anthropic-key
      model: claude-opus-4-8
      version: 2023-06-01
      base-url: https://api.anthropic.com/v1
      max-tokens: 1024
      max-response-chars: 100000
      connect-timeout: 5s
      read-timeout: 60s

    openai:
      api-key: test-openai-key

    retry:
      enabled: false

  audit:
    retention:
      enabled: false

  security:
    user-status-cache:
      enabled: false

    hsts:
      enabled: false

  rate-limit:
    login:
      enabled: false

    ai-messages:
      enabled: false