# D:\Java projects\Safeai-desk\backend\src\test\resources\application-test.yml

app:
  security:
    jwt:
      secret: safeai-local-development-secret-key-change-this-value-please-123456789
      expiration-minutes: 15
      issuer: safeai-desk
      audience: safeai-desk-api

spring:
  data:
    redis:
      repositories:
        enabled: false

safeai:
  auth:
    cookies:
      secure: false
      same-site: Lax
      access-token-max-age: 15m
      refresh-token-max-age: 30d

  ai:
    provider: mock

    anthropic:
      api-key: test-anthropic-key
      model: claude-opus-4-8
      version: 2023-06-01
      base-url: https://api.anthropic.com/v1
      max-tokens: 1024
      max-response-chars: 100000
      connect-timeout: 5s
      read-timeout: 60s

    openai:
      api-key: test-openai-key

    retry:
      enabled: false

  audit:
    retention:
      enabled: false

  security:
    user-status-cache:
      enabled: false

  rate-limit:
    login:
      enabled: false

    ai-messages:
      enabled: false