# D:\Java projects\Safeai-desk\backend\src\test\resources\application-test.yml
app:
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      expiration-minutes: 15
      issuer: https://issuer.safeai.test
      audience: safeai-desk-api

spring:
  data:
    redis:
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    validate-migration-naming: true
    postgresql:
      transactional-lock: false

safeai:
  platform:
    organization-id: 00000000-0000-0000-0000-000000000001

  ai:
    # Общие интеграционные тесты не обращаются
    # к внешним AI-провайдерам.
    provider: mock

    retry:
      enabled: false
      max-attempts: 1
      total-timeout: 5s

    pricing:
      models:
        - model: mock-safeai
          input-usd-per-1m-tokens: 0
          output-usd-per-1m-tokens: 0
          currency: USD
          version: mock-2026-01

  auth:
    cookies:
      secure: false
      same-site: Lax

      # Должно совпадать с
      # app.security.jwt.expiration-minutes: 15
      access-token-max-age: PT15M

      refresh-token-max-age: P30D
      refresh-token-absolute-max-age: P90D
      reuse-detection-retention: P7D

      domain: ""
      access-token-name: safeai-access
      refresh-token-name: safeai-refresh

    refresh-cleanup:
      cron: "0 0 3 * * *"
      batch-size: 200
      max-batches-per-run: 100

  rate-limit:
    redis:
      key-prefix: safeai:test
      hmac-secret: safeai-test-rate-limit-hmac-secret-for-integration-tests-2026
      key-version: v1

    login:
      enabled: true
      email-limit: 10
      ip-limit: 100
      window: 10m
      audit-organization-id: 00000000-0000-0000-0000-000000000001

    ai-messages:
      enabled: true
      user-limit-per-hour: 20
      admin-limit-per-hour: 100
      organization-limit-per-hour: 1000

  security:
    client-ip:
      trusted-proxy-cidrs:
        - 127.0.0.1/32
        - ::1/128

    user-status-cache:
      enabled: false
      ttl: 60s
      key-prefix: safeai:test:user-status

    hsts:
      enabled: false

  audit:
    outbox:
      batch-size: 100

      # Практически отключает автоматический polling
      # во время тестов.
      poll-delay-ms: 3600000

    retention:
      enabled: false

  user-management:
    permanent-deletion-retention: 0s