openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: SafeAI Desk — Erasure Case Management API
  version: 1.2.0-design-r2.3
  summary: Hardened design plus R2.3 workspace candidate; not a verified runtime contract
  description: |
    DESIGN ONLY / NO PRODUCTION GO.
    This specification does not enable any destructive endpoint.
    R1a registers DRAFT/SUBMITTED/WITHDRAWN; R1b registers independent review and holds.
    R2.3 workspace is a candidate, not acceptance. Physical execution remains disabled.
    Original paths/schemas are TARGET_DESIGN_NOT_RUNTIME unless explicitly marked otherwise.
    Do not generate a runtime client from this combined design document.
    Every transition checks fresh server-side actor, tenant, resource version, hold, policy
    and approval state.
    Existing Chat, Knowledge and User destructive endpoints MUST share the enforcement gate before
    any executor rollout.
servers:
  - url: /
    description: Relative server URL; authorization and origins follow existing deployment
tags:
  - name: Read
  - name: Workspace
  - name: Cases
  - name: Identity
  - name: Approvals
  - name: Holds
  - name: Evidence
  - name: Operations
security:
  - bearerAuth: []
x-safeai-security-notes: |
  Bearer flow modeled here. Existing browser cookie authentication may also apply in the
  deployment.
  Its exact cookie name and CSRF mechanism must be copied from the actual Auth/Security
  configuration
  before generating a cookie-auth client or enabling these routes. All browser
  state-changing actions
  require the existing CSRF protection; never invent a CSRF exemption or accept client
  roles/tenant.
  Security requirements in OpenAPI alone do not enforce RBAC, RLS, step-up or independence.
x-safeai-release-gates:
  R1: Case intake, preview, approval registration and read only; all execution flags OFF.
  R2: User/tenant/platform UI and read-only projections; notifications require verification; no destructive dispatch.
  R2_3: Registry summary/detail/history and role acceptance; candidate, no destructive dispatch.
  R3_PLUS: Individually reviewed executor/worker/storage/legal evidence per resource type.
x-safeai-runtime-route-map:
  R1a:
    status: SOURCE_OBSERVED_NOT_ACCEPTED
    notes: Actual list is self only, limit 100. Existing same-name target DTOs are not runtime DTOs. Preview uses
      Target; submit/withdraw use headers and no body in R1a. Flag safeai.erasure.requests.enabled.
  R1b:
    status: SOURCE_OBSERVED_NOT_ACCEPTED
    notes: 'Actual review controller under /api/admin/erasure/reviews: GET base/access/overview/{id}/{id}/events;
      POST {id}/decision, {id}/holds, {id}/holds/release. Personal /api/erasure/requests/{id}/review, /review-events
      and POST /provide-information. Flag safeai.erasure.approvals.enabled. APPROVED_REVIEW_ONLY is never execution.
      Do not substitute target approve/reject/release-hold routes.'
  R2.3:
    status: CANDIDATE_NOT_ACCEPTED
    notes: Workspace read contract below, pending Maven/real PostgreSQL/HTTP/CI. No runtime mutation schema changes.
