        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: DELETE_OBJECT
            resourceType:
              const: EXPORT
            scope:
              const: SERVER_EXPORT
            resourceId:
              type: string
              format: uuid
    PreviewCreate:
      type: object
      additionalProperties: false
      required:
        - target
      properties:
        target:
          $ref: '#/components/schemas/ErasureTarget'
    PreviewSummary:
      type: object
      additionalProperties: false
      description: Only non-sensitive category counts, never foreign resource names or contents
      required:
        - categories
        - holdsCount
        - dependenciesCount
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - count
            properties:
              code:
                type: string
                maxLength: 64
                pattern: ^[A-Z0-9_]+$
              count:
                type: integer
                minimum: 0
          maxItems: 64
        holdsCount:
          type: integer
          minimum: 0
        dependenciesCount:
          type: integer
          minimum: 0
        transferRequired:
          type: boolean
        activeSessions:
          type: integer
          minimum: 0
        retainedEvidencePresent:
          type: boolean
    PreviewResult:
      type: object
      additionalProperties: false
      description: Preview bound in storage to actor, tenant, target, policy/hold epochs and TTL
      required:
        - previewId
        - target
        - risk
        - summary
        - blockedReasons
        - manifestDigest
        - previewDigest
        - expiresAt
        - resourceVersion
        - policyVersion
        - holdEpoch
        - submitAllowed
      properties:
        previewId:
          type: string
          format: uuid
        target:
          $ref: '#/components/schemas/ErasureTarget'
        risk:
          $ref: '#/components/schemas/Risk'
        summary:
          $ref: '#/components/schemas/PreviewSummary'
        blockedReasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
          maxItems: 32
        manifestDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
        previewDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
        expiresAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          minimum: 0
        policyVersion:
          type: integer
          minimum: 0
        holdEpoch:
          type: integer
          minimum: 0
        submitAllowed:
          type: boolean
        approvalRequirement:
          type: object
          additionalProperties: false
          required:
            - minimumIndependentApprovals
          properties:
            minimumIndependentApprovals:
              type: integer
              minimum: 0
              maximum: 2
            stepUpRequired:
              type: boolean
    RequestCreate:
      type: object
      additionalProperties: false
      description: Creates DRAFT only; organization and actor are derived by the server
      required:
        - previewId
        - previewDigest
        - target
        - expectedResourceVersion
        - reasonCode
      properties:
        previewId:
          type: string
          format: uuid
        previewDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
        target:
          $ref: '#/components/schemas/ErasureTarget'
        expectedResourceVersion:
          type: integer
          minimum: 0
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        externalCaseRef:
          type: string
          minLength: 1
          maxLength: 96
          pattern: ^[A-Za-z0-9._:-]+$
    RequestSubmit:
      type: object
      additionalProperties: false
      description: Fast revalidation at submit, full dependency preflight follows asynchronously
      required:
        - previewDigest
        - manifestDigest
      properties:
        previewDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
        manifestDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
    ScopeConfirmation:
      type: object
      additionalProperties: false
      description: Needed if full preflight expands scope or changes dependency/hold digest; does not
        execute
      required:
        - manifestDigest
        - resourceVersion
      properties:
        manifestDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
        resourceVersion:
          type: integer
          minimum: 0
        stepUpProofId:
          type: string
          format: uuid
    RequestView:
      type: object
      additionalProperties: false
      description: Sanitized, scoped case view. Does not expose other tenants, secrets or contents
      required:
        - requestId
        - state
        - target
        - version
        - createdAt
        - updatedAt
        - executionStarted
        - completionProven
        - nextActions
        - approvalProgress
        - executionReadiness
        - verifiedCompletionScope
      properties:
        requestId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/RequestState'
        target:
          $ref: '#/components/schemas/ErasureTarget'
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        executionStarted:
          type: boolean
        completionProven:
          type: boolean
        nextActions:
          type: array
          items:
            type: string
            enum:
              - VERIFY_IDENTITY
              - SUBMIT
              - CONFIRM_SCOPE
              - PROVIDE_INFORMATION
              - WITHDRAW
              - REQUEST_PAUSE
              - WAIT
              - VIEW_RECEIPT
          maxItems: 8
        approvalProgress:
          type: object
          additionalProperties: false
          required:
            - required
            - recorded
          properties:
            required:
              type: integer
              minimum: 0
              maximum: 2
            recorded:
              type: integer
              minimum: 0
              maximum: 2
        executionReadiness:
          $ref: '#/components/schemas/ExecutionReadiness'
        verifiedCompletionScope:
          type: string
          enum:
            - NONE
            - ACTIVE_SCOPE
            - FULL_SCOPE
        blockedReasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
          maxItems: 32
        coolingUntil:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        ownerDisplayCategory:
          type: string
          maxLength: 60
        receiptAvailable:
          type: boolean
        links:
          type: object
          additionalProperties: false
          required:
            - self
          properties:
            self:
              type: string
              minLength: 1
              maxLength: 256
      allOf:
        - if:
            properties:
              state:
                const: DRAFT
            required:
              - state
          then:
            properties:
              executionStarted:
                const: false
              completionProven:
                const: false
              verifiedCompletionScope:
                const: NONE
        - if:
            properties:
              state:
                const: COMPLETED_FULL_SCOPE
            required:
              - state
          then:
            properties:
              completionProven:
                const: true
              verifiedCompletionScope:
                const: FULL_SCOPE
    RequestPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestView'
          maxItems: 100
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2048
            - type: 'null'
    CaseEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - state
        - reasonCode
        - createdAt
      properties:
        eventId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/RequestState'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        createdAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum:
            - REQUESTER
            - APPROVER
            - OPERATOR
            - WORKER
            - SYSTEM
    EventsPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaseEvent'
          maxItems: 100
        nextCursor:
          oneOf:
            - type: string
              maxLength: 2048
            - type: 'null'
    Capability:
      type: object
      additionalProperties: false
      description: Hint only; authorization is revalidated on every transition and worker dispatch
      required:
        - canCreateDraft
        - canSubmit
        - executionReadiness
        - reasons
        - minimumIndependentApprovals
      properties:
        canCreateDraft:
          type: boolean
        canSubmit:
          type: boolean
        executionReadiness:
          $ref: '#/components/schemas/ExecutionReadiness'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCode'
          maxItems: 32
        minimumIndependentApprovals:
          type: integer
          minimum: 0
          maximum: 2
        stepUpRequired:
          type: boolean
        resourceVersion:
          type: integer
          minimum: 0
    Decision:
      type: object
      additionalProperties: false
      description: Approver must be eligible, independent, fresh-auth and current at decision time
      required:
        - manifestDigest
        - reasonCode
        - stepUpProofId
      properties:
        manifestDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        stepUpProofId:
          type: string
          format: uuid
    ActionReason:
      type: object
      additionalProperties: false
      required:
        - reasonCode
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
    IdentityProof:
      type: object
      additionalProperties: false
      required:
        - proofId
      properties:
        proofId:
          type: string
          format: uuid
    VerificationChallengeCreate:
      type: object
      additionalProperties: false
      description: No raw password, one-time code or personal identifier in request body
      required:
        - channel
      properties:
        channel:
          type: string
          enum:
            - VERIFIED_IN_APP
            - VERIFIED_SUPPORT
    VerificationChallenge:
      type: object
      additionalProperties: false
      description: Opaque handle, does not reveal whether a foreign account exists
      required:
        - challengeId
        - expiresAt
        - nextAction
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        nextAction:
          type: string
          enum:
            - COMPLETE_STEP_UP
            - CONTACT_VERIFIED_SUPPORT
    AdditionalInformation:
      type: object
      additionalProperties: false
      description: References verified evidence held in a separate controlled store, not raw PII
      required:
        - informationCode
        - evidenceRef
      properties:
        informationCode:
          $ref: '#/components/schemas/ReasonCode'
        evidenceRef:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
    PauseRequest:
      type: object
      additionalProperties: false
      description: After destructive barrier, safe pause/review only; never promises rollback
      required:
        - reasonCode
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
    HoldCreate:
      type: object
      additionalProperties: false
      description: Legal authority only; hold placement serialized against destructive fence
      required:
        - reasonCode
        - legalReferenceId
        - effectiveScope
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        legalReferenceId:
          type: string
          format: uuid
        effectiveScope:
          type: string
          enum:
            - TARGET
            - MANIFEST_CHILDREN
    HoldReleasePetition:
      type: object
      additionalProperties: false
      description: Petition only; cannot release an Object Lock/legal hold
      required:
        - holdId
        - reasonCode
        - legalEvidenceRef
        - stepUpProofId
      properties:
        holdId:
          type: string
          format: uuid
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        legalEvidenceRef:
          type: string
          format: uuid
        stepUpProofId:
          type: string
          format: uuid
    HoldReleaseDecision:
      type: object
      additionalProperties: false
      description: Independent authorized decision, legal checks and provider enforcement required
      required:
        - petitionId
        - reasonCode
        - stepUpProofId
      properties:
        petitionId:
          type: string
          format: uuid
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        stepUpProofId:
          type: string
          format: uuid
    HoldState:
      type: object
      additionalProperties: false
      required:
        - holdId
        - state
        - scope
        - releasePetitionState
      properties:
        holdId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - ACTIVE
            - RELEASE_REVIEW
            - RELEASED
        scope:
          type: string
          enum:
            - TARGET
            - MANIFEST_CHILDREN
        releasePetitionState:
          type: string
          enum:
            - NONE
            - PENDING
            - APPROVED
            - REJECTED
        protectedUntil:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    OperationStep:
      type: object
      additionalProperties: false
      description: Diagnostic only; neither retry nor reconcile can mark removed manually
      required:
        - stepId
        - state
        - reasonCode
        - version
        - updatedAt
        - attempts
      properties:
        stepId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - WAITING
            - RUNNING
            - RETRY_WAIT
            - BLOCKED
            - NEEDS_REVIEW
            - VERIFYING
            - VERIFIED
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        attempts:
          type: integer
          minimum: 0
        fencingEpoch:
          type: integer
          minimum: 0
    OperationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationStep'
          maxItems: 100
        nextCursor:
          oneOf:
            - type: string
              maxLength: 2048
            - type: 'null'
    OperatorAction:
      type: object
      additionalProperties: false
      description: Operator cannot choose a target, scope or terminal result
      required:
        - reasonCode
        - runbookId
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        runbookId:
          type: string
          minLength: 3
          maxLength: 80
          pattern: ^[A-Za-z0-9._:-]+$
    ExceptionObligation:
      type: object
      additionalProperties: false
      description: No object path, PII or raw provider diagnostics
      required:
        - category
        - state
        - reasonCode
      properties:
        category:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_]*$
        state:
          $ref: '#/components/schemas/ObligationState'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        reviewAfter:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        legalBasisCode:
          $ref: '#/components/schemas/ReasonCode'
    Receipt:
      type: object
      additionalProperties: false
      description: Sanitized proof for explicitly verified scope; no promise of universal erasure
      required:
        - requestId
        - completionState
        - verifiedScope
        - evidenceDigest
        - verifiedAt
        - obligations
        - externalScopeStatus
        - backupScopeStatus
      properties:
        requestId:
          type: string
          format: uuid
        completionState:
          type: string
          enum:
            - COMPLETED_ACTIVE_SCOPE
            - COMPLETED_FULL_SCOPE
            - COMPLETED_WITH_EXCEPTIONS
        verifiedScope:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          maxItems: 24
        evidenceDigest:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
          minLength: 64
        verifiedAt:
          type: string
          format: date-time
        obligations:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionObligation'
          maxItems: 500
        externalScopeStatus:
          type: string
          enum:
            - VERIFIED
            - NOT_APPLICABLE
            - PENDING
            - UNVERIFIABLE
        backupScopeStatus:
          type: string
          enum:
            - VERIFIED
            - NOT_APPLICABLE
            - PENDING
            - RETAINED
        signatureReference:
          type: string
          maxLength: 128
      allOf:
        - if:
            properties:
              completionState:
                const: COMPLETED_FULL_SCOPE
            required:
              - completionState
          then:
            properties:
              externalScopeStatus:
                enum:
                  - VERIFIED
                  - NOT_APPLICABLE
              backupScopeStatus:
                enum:
                  - VERIFIED
                  - NOT_APPLICABLE
              obligations:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ExceptionObligation'
                    - properties:
                        state:
                          enum:
                            - VERIFIED_REMOVED
                            - EXPIRED_CONFIRMED
    ApiError:
      type: object
      additionalProperties: false
      description: No SQL, bucket names, foreign tenant, raw PII, provider secret or document text
      required:
        - code
        - message
        - correlationId
        - retryable
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 240
        correlationId:
          type: string
          format: uuid
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 1
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - reasonCode
            properties:
              field:
                type: string
                maxLength: 64
                pattern: ^[A-Za-z0-9._-]+$
              reasonCode:
                $ref: '#/components/schemas/ReasonCode'
          maxItems: 16
