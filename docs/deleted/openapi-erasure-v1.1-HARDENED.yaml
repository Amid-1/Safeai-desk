          type: string
          format: uuid
    ErasureTarget:
      description: Exactly one allowed (operation, resourceType, scope) triple; availability is
        independently gated.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: REDACT_CONTENT
            resourceType:
              const: CHAT
            scope:
              const: FULL_CHAT_CONTENT
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: REDACT_CONTENT
            resourceType:
              const: CHAT_MESSAGE
            scope:
              const: MESSAGE_CONTENT
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: REDACT_CONTENT
            resourceType:
              const: AI_RESPONSE
            scope:
              const: AI_RESPONSE_CONTENT
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: DELETE_OBJECT
            resourceType:
              const: KNOWLEDGE_DOCUMENT
            scope:
              const: FULL_DOCUMENT
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: DELETE_OBJECT
            resourceType:
              const: KNOWLEDGE_DOCUMENT_VERSION
            scope:
              const: DOCUMENT_VERSION
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: DELETE_OBJECT
            resourceType:
              const: KNOWLEDGE_BASE
            scope:
              const: FULL_KNOWLEDGE_BASE
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: DELETE_ACCOUNT
            resourceType:
              const: USER_ACCOUNT
            scope:
              const: PERSONAL_DATA_AND_ACCESS
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: OFFBOARD_TENANT
            resourceType:
              const: ORGANIZATION
            scope:
              const: ORGANIZATION_OFFBOARDING
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: DETACH
            resourceType:
              const: MODEL_BINDING
            scope:
              const: TENANT_MODEL_ACCESS
            resourceId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - operation
            - resourceType
            - scope
            - resourceId
          properties:
            operation:
              const: RETIRE_MODEL
            resourceType:
              const: MODEL_CATALOG
            scope:
              const: GLOBAL_MODEL_LIFECYCLE
            resourceId:
              type: string
              format: uuid
        - type: object
