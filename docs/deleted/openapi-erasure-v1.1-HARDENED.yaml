components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Actual JWT/session handling comes from the existing SafeAI Auth layer.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HoldId:
      name: holdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Replay scoped by authenticated principal, tenant, endpoint and canonical body
        digest.
      schema:
        type: string
        minLength: 12
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from latest authorized response, e.g. "3".
      schema:
        type: string
        pattern: ^"[0-9]+"$
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    TenantSelector:
      name: organizationId
      in: query
      required: false
      description: Only platform-authorized principals; ordinary users cannot select another tenant.
      schema:
        type: string
        format: uuid
    StateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/RequestState'
    ResourceTypeQuery:
      name: resourceType
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ResourceType'
    ResourceIdQuery:
      name: resourceId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    OperationQuery:
      name: operation
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Operation'
    ScopeQuery:
      name: scope
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Scope'
  schemas:
    WorkspaceCapabilitiesR23:
      type: object
      required:
      - platform
      - tenantRegistry
      - personalRequests
      - reviewQueue
      - requestsEnabled
      - approvalsEnabled
      additionalProperties: false
      properties:
        platform:
          type: boolean
        tenantRegistry:
          type: boolean
        personalRequests:
          type: boolean
        reviewQueue:
          type: boolean
        requestsEnabled:
          type: boolean
        approvalsEnabled:
          type: boolean
    WorkspaceLegacySummary:
      type: object
      required:
      - total
      - pending
      - held
      - needsInformation
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
        needsInformation:
          type: integer
          minimum: 0
    WorkspaceRegistrySummaryR23:
      type: object
      required:
      - scope
      - total
      - registered
      - withdrawn
      - drafts
      - reviewed
      - pending
      - needsInformation
      - held
      additionalProperties: false
      properties:
        scope:
          type: string
          enum:
          - PLATFORM
          - TENANT
        total:
          type: integer
          minimum: 0
        registered:
          type: integer
          minimum: 0
        withdrawn:
          type: integer
          minimum: 0
        drafts:
          type:
          - integer
          - 'null'
          minimum: 0
        reviewed:
          type:
          - integer
          - 'null'
          minimum: 0
        pending:
          type:
          - integer
          - 'null'
          minimum: 0
        needsInformation:
          type:
          - integer
          - 'null'
          minimum: 0
        held:
          type:
          - integer
          - 'null'
          minimum: 0
      allOf:
      - if:
          properties:
            scope:
              const: TENANT
        then:
          properties:
            reviewed:
              type: 'null'
            pending:
              type: 'null'
            needsInformation:
              type: 'null'
            held:
              type: 'null'
            drafts:
              type: integer
              minimum: 0
        else:
          properties:
            reviewed:
              type: integer
              minimum: 0
            pending:
              type: integer
              minimum: 0
            needsInformation:
              type: integer
              minimum: 0
            held:
              type: integer
              minimum: 0
            drafts:
              type: 'null'
    WorkspaceRegistryItemR23:
      type: object
      required:
      - requestId
      - organization
      - requester
      - resourceType
      - state
      - holdActive
      - updatedAt
      - intakeState
      - reviewState
      - reviewVisible
      additionalProperties: false
