# SafeAI-Desk/infra/docker-compose.yml
name: safeai

x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  backend:
    image: "${SAFEAI_BACKEND_IMAGE:?SAFEAI_BACKEND_IMAGE is required}"

    # Этот env_file передаёт в контейнер только НЕсекретные runtime-настройки.
    # Для интерполяции ${...} самого Compose-файла всё равно запускайте Compose
    # с --env-file ../backend/.env.prod.
    env_file:
      - ../backend/.env.prod

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"

      # pricing.yml — обычная внешняя конфигурация.
      # jwt-keys.yml — секретный RSA key ring.
      SPRING_CONFIG_ADDITIONAL_LOCATION: >-
        file:/run/config/pricing.yml,file:/run/secrets/jwt-keys.yml

      SAFEAI_DB_APP_USER: "${SAFEAI_DB_APP_USER:?SAFEAI_DB_APP_USER is required}"
      SAFEAI_DB_MIGRATOR_USER: "${SAFEAI_DB_MIGRATOR_USER:?SAFEAI_DB_MIGRATOR_USER is required}"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Production storage принудительно S3 в application-prod.yml.
      # Здесь задаются только несекретные параметры S3.
      SAFEAI_KNOWLEDGE_STORAGE_ENDPOINT: "${SAFEAI_KNOWLEDGE_STORAGE_ENDPOINT:?SAFEAI_KNOWLEDGE_STORAGE_ENDPOINT is required}"
      SAFEAI_KNOWLEDGE_STORAGE_BUCKET: "${SAFEAI_KNOWLEDGE_STORAGE_BUCKET:-safeai-knowledge}"

    secrets:
      # Эти секреты импортируются Spring Boot через:
      # spring.config.import=optional:configtree:/run/secrets/
      - source: db_app_password
        target: SAFEAI_DB_APP_PASSWORD

      - source: db_migrator_password
        target: SAFEAI_DB_MIGRATOR_PASSWORD

      - source: redis_password
        target: REDIS_PASSWORD

      - source: rate_limit_hmac_secret
        target: SAFEAI_RATE_LIMIT_REDIS_HMAC_SECRET

      - source: openai_api_key
        target: OPENAI_API_KEY

      - source: openai_api_key
        target: OPENAI_EMBEDDING_API_KEY

      - source: knowledge_ocr_api_key
        target: KNOWLEDGE_OCR_API_KEY

      - source: anthropic_api_key
        target: ANTHROPIC_API_KEY

      - source: knowledge_storage_access_key
        target: SAFEAI_KNOWLEDGE_STORAGE_ACCESS_KEY

      - source: knowledge_storage_secret_key
        target: SAFEAI_KNOWLEDGE_STORAGE_SECRET_KEY

      # Этот secret не является одной scalar-property.
      # Spring читает его как полноценный YAML через
      # SPRING_CONFIG_ADDITIONAL_LOCATION.
      - source: jwt_keys
        target: jwt-keys.yml

    volumes:
      - type: bind
        source: "${SAFEAI_CONFIG_DIR:?SAFEAI_CONFIG_DIR is required}/pricing.yml"
        target: /run/config/pricing.yml
        read_only: true

    user: "10001:10001"

    # SAFEAI_SECRET_GID должен соответствовать группе,
    # которой на host доступны secret-файлы.
    group_add:
      - "${SAFEAI_SECRET_GID:?SAFEAI_SECRET_GID is required}"

    expose:
      - "8080"

    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: >-
        curl -fsS http://localhost:8080/actuator/health/readiness
        | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    networks:
      safeai_edge:
        ipv4_address: 172.28.0.20
      safeai_data: {}

    init: true
    stop_grace_period: 105s

    read_only: true

    tmpfs:
      - "/tmp:size=64m,mode=1777,noexec,nosuid,nodev"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    cpus: "1.0"
    mem_limit: 768m
    mem_reservation: 256m
    pids_limit: 256

    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: "${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}"

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_BOOTSTRAP_USER:?POSTGRES_BOOTSTRAP_USER is required}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password

      SAFEAI_DB_MIGRATOR_USER: "${SAFEAI_DB_MIGRATOR_USER:?SAFEAI_DB_MIGRATOR_USER is required}"
      SAFEAI_DB_APP_USER: "${SAFEAI_DB_APP_USER:?SAFEAI_DB_APP_USER is required}"

    secrets:
      - source: postgres_bootstrap_password
        target: postgres_bootstrap_password
      - source: db_migrator_password
        target: db_migrator_password
      - source: db_app_password
        target: db_app_password

    volumes:
      - safeai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: >-
        pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      safeai_data: {}

    shm_size: 256m

    security_opt:
      - no-new-privileges:true

    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 256

    logging: *default-logging
    restart: unless-stopped

  db-bootstrap:
    image: "${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}"

    entrypoint:
      - /bin/bash
      - /docker-entrypoint-initdb.d/10-create-app-roles.sh

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_BOOTSTRAP_USER:?POSTGRES_BOOTSTRAP_USER is required}"

      SAFEAI_DB_MIGRATOR_USER: "${SAFEAI_DB_MIGRATOR_USER:?SAFEAI_DB_MIGRATOR_USER is required}"
      SAFEAI_DB_APP_USER: "${SAFEAI_DB_APP_USER:?SAFEAI_DB_APP_USER is required}"

    secrets:
      - source: postgres_bootstrap_password
        target: postgres_bootstrap_password
      - source: db_migrator_password
        target: db_migrator_password
      - source: db_app_password
        target: db_app_password

    volumes:
      - type: bind
        source: ./postgres/init/10-create-app-roles.sh
        target: /docker-entrypoint-initdb.d/10-create-app-roles.sh
        read_only: true

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      safeai_data: {}

    user: "0:0"
    read_only: true

    tmpfs:
      - "/tmp:size=16m,mode=1777,noexec,nosuid,nodev"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging: *default-logging
    restart: "no"

  redis:
    image: "${REDIS_IMAGE:?REDIS_IMAGE is required}"

    entrypoint:
      - /bin/sh
      - -euc

    command:
      - |
        REDIS_PASSWORD="$$(tr -d '\r\n' < /run/secrets/redis_password)"
        test -n "$$REDIS_PASSWORD"

        umask 077

        cat > /tmp/redis.conf <<EOF
        requirepass $$REDIS_PASSWORD
        appendonly yes
        appendfsync everysec
        maxmemory 192mb
        maxmemory-policy noeviction
        EOF

        chown redis:redis /tmp/redis.conf

        exec /usr/local/bin/docker-entrypoint.sh \
          redis-server /tmp/redis.conf

    secrets:
      - source: redis_password
        target: redis_password

    volumes:
      - safeai_redis_data:/data

    read_only: true

    tmpfs:
      - "/tmp:size=16m,mode=1777,noexec,nosuid,nodev"

    healthcheck:
      test: >-
        REDISCLI_AUTH="$$(tr -d '\r\n' < /run/secrets/redis_password)"
        redis-cli --no-auth-warning ping
        | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      safeai_data: {}

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    security_opt:
      - no-new-privileges:true

    cpus: "0.5"
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128

    logging: *default-logging
    restart: unless-stopped

  nginx:
    image: "${SAFEAI_NGINX_IMAGE:?SAFEAI_NGINX_IMAGE is required}"

    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: >-
        wget -q -O - http://127.0.0.1:8080/healthz
        | grep -q '^ok$'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      safeai_edge:
        ipv4_address: 172.28.0.10

    user: "101:101"
    init: true
    read_only: true

    tmpfs:
      - "/tmp:size=32m,mode=1777,noexec,nosuid,nodev"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 128

    logging: *default-logging
    restart: unless-stopped

volumes:
  safeai_postgres_data:
    name: safeai_postgres_data

  safeai_redis_data:
    name: safeai_redis_data

networks:
  safeai_edge:
    name: safeai_edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  safeai_data:
    name: safeai_data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1

secrets:
  postgres_bootstrap_password:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/postgres_bootstrap_password"

  db_migrator_password:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/db_migrator_password"

  db_app_password:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/db_app_password"

  redis_password:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/redis_password"

  rate_limit_hmac_secret:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/rate_limit_hmac_secret"

  openai_api_key:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/openai_api_key"

  knowledge_ocr_api_key:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/knowledge_ocr_api_key"

  anthropic_api_key:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/anthropic_api_key"

  knowledge_storage_access_key:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/knowledge_storage_access_key"

  knowledge_storage_secret_key:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/knowledge_storage_secret_key"

  jwt_keys:
    file: "${SAFEAI_SECRETS_DIR:?SAFEAI_SECRETS_DIR is required}/jwt-keys.yml"
