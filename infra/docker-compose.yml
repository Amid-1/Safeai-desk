name: safeai

services:
  backend:
    image: "safeai-backend:${SAFEAI_BACKEND_IMAGE_TAG}"

    env_file:
      - ../backend/.env.prod

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: >-
        curl -fsS http://localhost:8080/actuator/health/readiness
        | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

    networks:
      - safeai_edge
      - safeai_data

    init: true
    stop_grace_period: 75s
    read_only: true

    tmpfs:
      - "/tmp:size=64m,mode=1777,noexec,nosuid,nodev"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
        reservations:
          memory: 256M

    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    volumes:
      - safeai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: >-
        pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - safeai_data

    shm_size: 256M

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 256
        reservations:
          memory: 256M

    restart: unless-stopped

  redis:
    image: redis:7

    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 192mb
        --maxmemory-policy noeviction

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    volumes:
      - safeai_redis_data:/data

    healthcheck:
      test: >-
        redis-cli --no-auth-warning
        -a "$${REDIS_PASSWORD}"
        ping
        | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - safeai_data

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          memory: 64M

    restart: unless-stopped

  nginx:
    image: "safeai-nginx:${SAFEAI_FRONTEND_IMAGE_TAG}"

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - safeai_edge

    init: true

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 128
        reservations:
          memory: 32M

    restart: unless-stopped

volumes:
  safeai_postgres_data:
    name: safeai_postgres_data

  safeai_redis_data:
    name: safeai_redis_data

networks:
  safeai_edge:
    name: safeai_edge
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

  safeai_data:
    name: safeai_data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24