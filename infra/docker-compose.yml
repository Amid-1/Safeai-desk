services:
  postgres:
    image: postgres:16
    container_name: safeai-postgres
    environment:
      POSTGRES_DB: safeai
      POSTGRES_USER: safeai
      POSTGRES_PASSWORD: safeai_password
    ports:
      - "5432:5432"
    volumes:
      - safeai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: safeai-redis
    ports:
      - "6379:6379"

volumes:
  safeai_postgres_data: