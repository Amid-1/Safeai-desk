# infra/nginx/nginx.conf
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    client_max_body_size 1m;

    keepalive_timeout 65s;
    send_timeout 70s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 70s;
    proxy_read_timeout 70s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    add_header Permissions-Policy camera=(),microphone=(),geolocation=(),payment=(),usb=() always;

    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self';" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 ok;
    }

    location = /actuator {
        access_log off;
        return 404;
    }

    location ^~ /actuator/ {
        access_log off;
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;

        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        try_files $uri =404;

        access_log off;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}