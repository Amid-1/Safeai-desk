# SafeAI-Desk/infra/nginx/nginx.conf
# Copied to /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged.

# Production topology:
# Internet -> host TLS terminator -> 127.0.0.1:8080 -> this container.
# The Docker bridge gateway is the only peer allowed to supply X-Real-IP.
set_real_ip_from 172.28.0.1;
real_ip_header X-Real-IP;
real_ip_recursive off;

limit_req_zone $binary_remote_addr
    zone=safeai_refresh:10m
    rate=2r/s;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Must be >= Spring multipart max-request-size (26MB).
    client_max_body_size 26m;
    client_body_buffer_size 128k;

    # Container filesystem is read-only in production; temporary request/proxy
    # buffers live on the /tmp tmpfs declared by Compose.
    client_body_temp_path /tmp/nginx-client-body 1 2;
    proxy_temp_path /tmp/nginx-proxy 1 2;

    keepalive_timeout 65s;
    send_timeout 90s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/snippets/safeai-security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Actuator is never proxied through the application edge. Prometheus and
    # backend health checks use the dedicated monitoring network/port 9091.
    location = /actuator {
        access_log off;
        return 404;
    }

    location ^~ /actuator/ {
        access_log off;
        return 404;
    }

    location = /api/auth/refresh {
        limit_req zone=safeai_refresh burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;

        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;

        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;

        # add_header in a location stops normal parent inheritance on older
        # Nginx versions, so repeat the security-header include here.
        include /etc/nginx/snippets/safeai-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        expires -1;
        include /etc/nginx/snippets/safeai-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # React Router / BrowserRouter fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
