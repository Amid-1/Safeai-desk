# SafeAi-Desk/infra/nginx/nginx.conf
#
# Этот файл копируется в /etc/nginx/conf.d/default.conf
# образа nginxinc/nginx-unprivileged.

map $http_x_request_id $safeai_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

map $http_x_real_ip $safeai_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# Coarse Internet-edge protection для public refresh endpoint.
#
# Зона объявляется на http {} level, поэтому находится вне server {}.
#
# Если этот Nginx когда-нибудь окажется за CDN/LB/reverse proxy,
# необходимо отдельно настроить trusted real_ip boundary.
limit_req_zone $binary_remote_addr
    zone=safeai_refresh:10m
    rate=2r/s;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    client_max_body_size 1m;

    keepalive_timeout 65s;
    send_timeout 90s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        application/json
        application/javascript
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        always;

    add_header Content-Security-Policy-Report-Only
        "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self';"
        always;

    location = /healthz {
        access_log off;
        default_type text/plain;

        return 200 "ok";
    }

    location = /readyz {
        access_log off;

        proxy_pass http://backend:8080/actuator/health/readiness;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $safeai_client_ip;
        proxy_set_header X-Forwarded-For $safeai_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $safeai_request_id;
    }

    #
    # Actuator не публикуется через application edge.
    #
    # /readyz выше является единственным специально проксируемым
    # readiness endpoint.
    #
    location = /actuator {
        access_log off;

        return 404;
    }

    location ^~ /actuator/ {
        access_log off;

        return 404;
    }

    #
    # Refresh-token endpoint.
    #
    # Exact location имеет приоритет над общим location /api/.
    #
    # Ограничение:
    #   2 request/second на source IP
    #   burst до 10 запросов
    #   превышение -> HTTP 429
    #
    location = /api/auth/refresh {
        limit_req zone=safeai_refresh burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $safeai_client_ip;
        proxy_set_header X-Forwarded-For $safeai_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $safeai_request_id;

        proxy_hide_header X-Powered-By;
    }

    #
    # Остальной backend API.
    #
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $safeai_client_ip;
        proxy_set_header X-Forwarded-For $safeai_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $safeai_request_id;

        proxy_hide_header X-Powered-By;
    }

    location /assets/ {
        try_files $uri =404;

        access_log off;
        expires 1y;

        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;

        add_header Cache-Control "no-store";
    }

    location = /favicon.ico {
        try_files $uri =404;

        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        try_files $uri =404;

        access_log off;
        log_not_found off;
    }

    #
    # BrowserRouter:
    # прямое открытие /chat или /admin/... возвращает SPA.
    #
    # /api/ и /actuator/ перехватываются более специфичными
    # location выше.
    #
    location / {
        try_files $uri $uri/ /index.html;
    }
}