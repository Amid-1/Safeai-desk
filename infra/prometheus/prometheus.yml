# SafeAi-Desk/infra/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: safeai-backend
    scheme: http
    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - backend:9091
