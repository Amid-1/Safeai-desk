services:
  backend:
    build:
      context: ../backend
    profiles:
      - full
    container_name: safeai-backend
    env_file:
      - ../backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/safeai
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-safeai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-safeai_password}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-safeai_redis_password}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: safeai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safeai}
      POSTGRES_USER: ${POSTGRES_USER:-safeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safeai_password}
    ports:
      - "5432:5432"
    volumes:
      - safeai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safeai} -d ${POSTGRES_DB:-safeai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: safeai-redis
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-safeai_redis_password}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  safeai_postgres_data: