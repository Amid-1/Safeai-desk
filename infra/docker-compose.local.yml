# SafeAI-Desk/infra/docker-compose.local.yml
name: safeai-local

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    profiles:
      - full

    # Для интерполяции ${...} запускать Compose с:
    # --env-file ../backend/.env
    env_file:
      - ../backend/.env

    environment:
      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

      SAFEAI_KNOWLEDGE_STORAGE_TYPE: s3
      SAFEAI_KNOWLEDGE_S3_ENDPOINT: http://minio:9000
      SAFEAI_KNOWLEDGE_S3_ACCESS_KEY: "${MINIO_ROOT_USER:-safeai}"
      SAFEAI_KNOWLEDGE_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-safeai-local-change-me}"

    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test: >-
        curl -fsS http://localhost:8080/actuator/health/readiness
        | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - safeai_local

    init: true
    stop_grace_period: 75s
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        protocol: tcp

    volumes:
      - safeai_postgres_local_data:/var/lib/postgresql/data

    healthcheck:
      test: >-
        pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - safeai_local

    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7

    entrypoint:
      - /bin/sh
      - -euc

    command:
      - |
        exec /usr/local/bin/docker-entrypoint.sh redis-server \
          --requirepass "$${REDIS_PASSWORD}" \
          --save "" \
          --appendonly no

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    ports:
      - target: 6379
        published: "6379"
        host_ip: 127.0.0.1
        protocol: tcp

    healthcheck:
      test: >-
        redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping
        | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

    networks:
      - safeai_local

    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-safeai}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-safeai-local-change-me}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - safeai_minio_local_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - safeai_local
    logging: *default-logging
    restart: unless-stopped

volumes:
  safeai_postgres_local_data:
    name: safeai_postgres_local_data
  safeai_minio_local_data:
    name: safeai_minio_local_data

networks:
  safeai_local:
    name: safeai_local
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
