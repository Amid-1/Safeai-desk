# SafeAI-Desk/infra/docker-compose.local.yml

name: safeai-local

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    profiles:
      - full

    # env_file paths are resolved relative to this Compose file.
    # CLI --env-file is separate and is resolved relative to the current shell.
    env_file:
      - ../backend/.env

    environment:
      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-safeai}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-safeai}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-safeai_password}"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-safeai_redis_password}"

      SAFEAI_MANAGEMENT_PORT: "9091"
      SAFEAI_MANAGEMENT_ADDRESS: "0.0.0.0"

      SAFEAI_KNOWLEDGE_STORAGE_TYPE: s3
      SAFEAI_KNOWLEDGE_STORAGE_ENDPOINT: "http://minio:9000"
      SAFEAI_KNOWLEDGE_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-safeai}"
      SAFEAI_KNOWLEDGE_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-safeai-local-change-me}"
      SAFEAI_KNOWLEDGE_STORAGE_BUCKET: "${SAFEAI_KNOWLEDGE_STORAGE_BUCKET:-safeai-knowledge}"

      # For profile=full, provide real local RSA PEM values from the shell.
      SAFEAI_JWT_PUBLIC_KEY: "${SAFEAI_JWT_PUBLIC_KEY:-}"
      SAFEAI_JWT_PRIVATE_KEY: "${SAFEAI_JWT_PRIVATE_KEY:-}"

    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp

    expose:
      - "9091"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test: >-
        curl -fsS http://localhost:9091/actuator/health/readiness
        | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - safeai_local

    init: true
    stop_grace_period: 75s
    logging: *default-logging
    restart: unless-stopped

  postgres:
    # Match production major version and pgvector extension availability.
    image: "${POSTGRES_IMAGE:-pgvector/pgvector:0.8.6-pg16-bookworm}"

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-safeai}"
      POSTGRES_USER: "${POSTGRES_USER:-safeai}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-safeai_password}"

    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        protocol: tcp

    volumes:
      - safeai_postgres_local_data:/var/lib/postgresql/data

    healthcheck:
      test: >-
        pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - safeai_local

    logging: *default-logging
    restart: unless-stopped

  redis:
    image: "${REDIS_IMAGE:-redis:7}"

    entrypoint:
      - /bin/sh
      - -euc

    command:
      - |
        exec /usr/local/bin/docker-entrypoint.sh redis-server \
          --requirepass "$${REDIS_PASSWORD}" \
          --save "" \
          --appendonly no

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-safeai_redis_password}"

    ports:
      - target: 6379
        published: "6379"
        host_ip: 127.0.0.1
        protocol: tcp

    healthcheck:
      test: >-
        redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping
        | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

    networks:
      - safeai_local

    logging: *default-logging
    restart: unless-stopped

  minio:
    image: "minio/minio:RELEASE.2025-07-23T15-54-02Z"

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-safeai}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-safeai-local-change-me}"

    ports:
      - target: 9000
        published: "9000"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9001
        published: "9001"
        host_ip: 127.0.0.1
        protocol: tcp

    volumes:
      - safeai_minio_local_data:/data

    # This is the healthcheck pattern used by MinIO's own Compose examples.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - safeai_local

    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: "prom/prometheus:v3.13.2"

    profiles:
      - full

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle=false

    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
      - safeai_prometheus_local_data:/prometheus

    ports:
      - target: 9090
        published: "9090"
        host_ip: 127.0.0.1
        protocol: tcp

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: >-
        wget -q -O - http://127.0.0.1:9090/-/ready
        | grep -q 'Prometheus Server is Ready'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - safeai_local

    logging: *default-logging
    restart: unless-stopped

volumes:
  safeai_postgres_local_data:
    name: safeai_postgres_local_data
  safeai_minio_local_data:
    name: safeai_minio_local_data
  safeai_prometheus_local_data:
    name: safeai_prometheus_local_data

networks:
  safeai_local:
    name: safeai_local
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
