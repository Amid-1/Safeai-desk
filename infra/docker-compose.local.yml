# /infra/ docker-compose.local.yml
name: safeai-local

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    profiles:
      - full

    env_file:
      - ../backend/.env

    environment:
      SPRING_PROFILES_ACTIVE: "local"

      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/safeai"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-safeai}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-safeai_password}"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-safeai_redis_password}"

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - safeai_local

    restart: unless-stopped


  postgres:
    image: "postgres:16"

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-safeai}"
      POSTGRES_USER: "${POSTGRES_USER:-safeai}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-safeai_password}"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - safeai_postgres_local_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - safeai_local

    restart: unless-stopped


  redis:
    image: "redis:7"

    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$${REDIS_PASSWORD}" \
          --save "" \
          --appendonly no

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-safeai_redis_password}"

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

    networks:
      - safeai_local

    restart: unless-stopped


volumes:
  safeai_postgres_local_data:
    name: safeai_postgres_local_data


networks:
  safeai_local:
    name: safeai_local
    driver: bridge